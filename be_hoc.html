<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Bé Học Toán</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
<div class="app">

    <!-- ========== SETUP ========== -->
    <div id="screen-setup" class="screen active">
        <div class="top-bar">
            <div class="title">🎯 Thiết Lập Bài Kiểm Tra</div>
            <a class="btn btn-gray btn-sm back-link" href="index.html">🏠 Trang chủ</a>
        </div>
        <div class="card">
            <div class="form-group">
                <label>Chọn độ khó:</label>
                <select id="setup-level">
                    <option value="all">Tất cả (dễ + khó)</option>
                    <option value="easy">Chỉ câu DỄ</option>
                    <option value="hard">Chỉ câu KHÓ</option>
                </select>
            </div>
            <div class="form-group">
                <label>Chọn bài:</label>
                <select id="setup-lesson"><option value="all">Tất cả các bài</option></select>
            </div>
            <div class="form-group">
                <label>Số câu hỏi: <span id="count-label" style="color:#3498db">5</span> câu (tối thiểu 5, tối đa 15)</label>
                <input type="range" id="setup-count" min="5" max="15" value="5"
                       oninput="document.getElementById('count-label').innerText=this.value">
            </div>
            <p id="pool-info" class="hint"></p>
            <button class="btn btn-green btn-wide" onclick="startQuiz()">🚀 Bắt đầu làm bài!</button>
        </div>
    </div>

    <!-- ========== QUIZ ========== -->
    <div id="screen-quiz" class="screen">
        <div class="top-bar">
            <div class="title" id="quiz-progress-label">Câu 1</div>
            <button class="btn btn-gray btn-sm" onclick="quitQuiz()">✖ Thoát</button>
        </div>
        <div class="progress-wrap"><div class="progress-bar" id="progress-bar"></div></div>
        <div class="card" id="quiz-card">
            <div id="visual-box"></div>
            <div id="question-text"></div>
            <div class="tries-info" id="tries-info"></div>
            <div id="options-box"></div>
            <div id="feedback"></div>
        </div>
    </div>

    <!-- ========== RESULT ========== -->
    <div id="screen-result" class="screen">
        <div class="card" style="text-align:center;">
            <div class="result-big" id="result-emoji">🎉</div>
            <h2 id="result-title" style="text-align:center;">Hoàn thành!</h2>
            <p class="stat" id="result-score"></p>
            <p class="stat" id="result-detail"></p>
            <p class="hint" id="result-saved">Kết quả đã được lưu lại.</p>
            <button class="btn btn-green btn-wide" onclick="goSetup()">🔄 Làm bài mới</button>
            <a class="btn btn-gray btn-wide back-link" style="margin-top:10px; display:block;" href="index.html">🏠 Trang chủ</a>
        </div>
    </div>

</div>

<script src="app.js"></script>
<script>
/* =========================================================
   BE_HOC.JS - Luồng dành cho học sinh
   ========================================================= */
const MAX_TRIES = 2;
let quizSet = [], qIdx = 0, score = 0, triesLeft = MAX_TRIES, quizMeta = {};

window.addEventListener('load', async () => {
    await ensureData();
    goSetup();
});

/* ---------- Điều hướng màn hình nội bộ ---------- */
function show(id) {
    document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
    document.getElementById(id).classList.add('active');
    window.scrollTo(0, 0);
}

/* ---------- SETUP ---------- */
function goSetup() {
    loadDb();
    rebuildSetupLessons();
    show('screen-setup');
    updatePoolInfo();
    document.getElementById('setup-level').onchange = updatePoolInfo;
    document.getElementById('setup-lesson').onchange = updatePoolInfo;
}
function rebuildSetupLessons() {
    const sel = document.getElementById('setup-lesson');
    const cur = sel.value;
    sel.innerHTML = '<option value="all">Tất cả các bài</option>' +
        getLessons().map(l => `<option value="${esc(l)}">${esc(l)}</option>`).join('');
    if ([...sel.options].some(o => o.value === cur)) sel.value = cur;
}
function currentPool() {
    return filterQuestions(
        document.getElementById('setup-level').value,
        document.getElementById('setup-lesson').value
    );
}
function updatePoolInfo() {
    const n = currentPool().length;
    const info = document.getElementById('pool-info');
    info.innerText = `Kho hiện có ${n} câu hỏi phù hợp.` + (n < 5 ? ' ⚠️ Cần tối thiểu 5 câu để bắt đầu.' : '');
    info.style.color = n < 5 ? '#e74c3c' : '#7f8c8d';
}

/* ---------- QUIZ ---------- */
function startQuiz() {
    const pool = currentPool();
    if (pool.length < 5) { alert('Cần tối thiểu 5 câu hỏi phù hợp. Hãy đổi bộ lọc hoặc thêm câu hỏi ở trang Quản Lý.'); return; }
    const n = Math.min(parseInt(document.getElementById('setup-count').value, 10), pool.length);
    quizSet = shuffle([...pool]).slice(0, n);
    qIdx = 0; score = 0;
    quizMeta = {
        level: document.getElementById('setup-level').value,
        lesson: document.getElementById('setup-lesson').value,
        total: quizSet.length
    };
    show('screen-quiz');
    renderQuizShell();
    showQuestion();
}

function renderQuizShell() {
    document.getElementById('quiz-card').innerHTML = `
        <div id="visual-box"></div>
        <div id="question-text"></div>
        <div class="tries-info" id="tries-info"></div>
        <div id="options-box"></div>
        <div id="feedback"></div>`;
}

function showQuestion() {
    triesLeft = MAX_TRIES;
    const q = quizSet[qIdx];
    document.getElementById('quiz-progress-label').innerText = `Câu ${qIdx + 1} / ${quizSet.length}`;
    document.getElementById('progress-bar').style.width = (qIdx / quizSet.length * 100) + '%';
    document.getElementById('visual-box').innerHTML = buildVisual(q.question);
    document.getElementById('question-text').innerText = q.question;
    document.getElementById('tries-info').innerText = '';
    document.getElementById('feedback').innerText = '';
    const opts = ['a', 'b', 'c'];
    document.getElementById('options-box').innerHTML = opts.map(o => `
        <button class="opt-btn" data-opt="option_${o}" onclick="answer('option_${o}', this)">
            ${o.toUpperCase()}. ${esc(q['option_' + o])}
        </button>`).join('');
}

/* Biểu diễn phép toán sinh động bằng emoji khi là phép cộng/trừ số nhỏ */
function buildVisual(text) {
    const m = text.match(/^\s*(\d{1,2})\s*([+\-])\s*(\d{1,2})/);
    if (!m) return '🧮';
    let x = parseInt(m[1], 10), op = m[2], y = parseInt(m[3], 10);
    if (x > 12 || y > 12) return (op === '+') ? '➕🧮' : '➖🧮';
    const emojis = ['🍎', '🍌', '🍓', '⭐', '🎈', '🐱', '🐶', '🚗', '🌸', '🍪'];
    const e = emojis[Math.floor(Math.random() * emojis.length)];
    const grp = n => e.repeat(n);
    return (op === '+')
        ? `<span>${grp(x)}</span> ➕ <span>${grp(y)}</span>`
        : `<span>${grp(x)}</span> ➖ <span style="opacity:.4">${grp(y)}</span>`;
}

function answer(selected, btn) {
    const q = quizSet[qIdx];
    const feedback = document.getElementById('feedback');
    const allBtns = document.querySelectorAll('.opt-btn');

    if (selected === q.correct_option) {
        btn.classList.add('correct');
        allBtns.forEach(b => b.disabled = true);
        feedback.style.color = '#2ecc71';
        feedback.innerText = (triesLeft === MAX_TRIES) ? 'Chính xác! Bé giỏi quá! 🎉' : 'Đúng rồi! Giỏi lắm! 🎉';
        if (triesLeft === MAX_TRIES) score++;      // đúng ngay lần đầu: 1 điểm
        else score += 0.5;                          // đúng ở lần 2: nửa điểm
        playCorrectSound();
        launchConfetti();
        setTimeout(nextQuestion, 1600);
    } else {
        triesLeft--;
        btn.classList.add('wrong');
        btn.disabled = true;
        playWrongSound();
        if (triesLeft > 0) {
            feedback.style.color = '#e67e22';
            feedback.innerText = 'Chưa đúng, thử lại nào! 💪';
            document.getElementById('tries-info').innerText = `Bé còn ${triesLeft} lần trả lời.`;
        } else {
            allBtns.forEach(b => { b.disabled = true; if (b.dataset.opt === q.correct_option) b.classList.add('correct'); });
            feedback.style.color = '#e74c3c';
            feedback.innerText = 'Hết lượt rồi, đáp án đúng đã hiện ra nhé! ❤️';
            document.getElementById('tries-info').innerText = '';
            setTimeout(nextQuestion, 2000);
        }
    }
}

function nextQuestion() {
    qIdx++;
    if (qIdx >= quizSet.length) { finishQuiz(); return; }
    showQuestion();
}

function quitQuiz() {
    if (confirm('Thoát bài kiểm tra? Kết quả sẽ không được lưu.')) location.href = 'index.html';
}

/* ---------- RESULT ---------- */
function finishQuiz() {
    document.getElementById('progress-bar').style.width = '100%';
    const total = quizSet.length;
    const pct = Math.round(score / total * 100);
    const scoreText = (Number.isInteger(score) ? score : score.toFixed(1));

    let emoji = '🎉', title = 'Hoàn thành!';
    if (pct >= 90) { emoji = '🏆'; title = 'Tuyệt vời! Bé là nhà vô địch!'; }
    else if (pct >= 70) { emoji = '🌟'; title = 'Giỏi lắm bé ơi!'; }
    else if (pct >= 50) { emoji = '👍'; title = 'Khá tốt, cố thêm nhé!'; }
    else { emoji = '💪'; title = 'Cố gắng luyện tập thêm nào!'; }

    document.getElementById('result-emoji').innerText = emoji;
    document.getElementById('result-title').innerText = title;
    document.getElementById('result-score').innerHTML = `Điểm: <b style="color:#2ecc71">${scoreText} / ${total}</b> (${pct}%)`;
    document.getElementById('result-detail').innerText =
        `Độ khó: ${labelLevel(quizMeta.level)} • Bài: ${quizMeta.lesson === 'all' ? 'Tất cả' : quizMeta.lesson}`;

    const record = {
        time: new Date().toLocaleString('vi-VN'),
        score: scoreText, total, percent: pct,
        level: labelLevel(quizMeta.level),
        lesson: quizMeta.lesson === 'all' ? 'Tất cả' : quizMeta.lesson
    };
    saveHistory(record);
    sendToSheet(record);

    if (pct >= 70) launchConfetti(true);
    show('screen-result');
}
</script>
</body>
</html>
