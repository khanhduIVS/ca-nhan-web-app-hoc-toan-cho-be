        .btn-opt:active:not(:disabled) { transform: translateY(2px); box-shadow: 0 2px #f1c40f; }
        .btn-opt:disabled { background-color: #dfe6e9; box-shadow: none; color: #b2bec3; }
        #feedback { font-size: 22px; font-weight: bold; margin-top: 20px; height: 30px; }
        .back-btn { display: inline-block; margin-top: 20px; color: #7f8c8d; text-decoration: none; font-weight: bold; font-size: 15px; }

        // Đọc trực tiếp file questions.json nằm chung thư mục trên GitHub Pages
        const GITHUB_RAW_URL = "questions.json";

        let questions = [];
        let currentIdx = 0;
        let score = 0;

        window.onload = async function() {
            try {
                // Thêm '?t=' + thời gian để ép trình duyệt luôn lấy file mới nhất từ GitHub, không dùng file cache cũ
                const res = await fetch(GITHUB_RAW_URL + '?t=' + new Date().getTime());
                if (!res.ok) throw new Error("Không thể tải file câu hỏi từ GitHub");
                
                questions = await res.json();
                
                // Tráo ngẫu nhiên thứ tự câu hỏi cho bé
                questions.sort(() => Math.random() - 0.5);
                showQuestion();
            } catch (err) {
                document.getElementById('question-text').innerText = "❌ Lỗi: Không thể đọc file questions.json trên GitHub! Bạn hãy kiểm tra lại file xem đã upload lên chưa nhé.";
                console.error(err);
            }
