<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Ứng Dụng Trắc Nghiệm Cho Bé</title>
    <style>
        body { font-family: 'Segoe UI', Arial, sans-serif; background-color: #eef7ff; text-align: center; padding: 15px; margin: 0; user-select: none; }
        .container { max-width: 550px; margin: 0 auto; }
        .page { display: none; }
        .active { display: block; }
        .card { background: white; padding: 25px; border-radius: 20px; box-shadow: 0 8px 16px rgba(0,0,0,0.1); border: 3px solid #ffde59; margin-top: 15px; text-align: center; }
        h1, h2 { color: #ff6b6b; margin-top: 0; }
        .btn-opt { display: block; width: 100%; margin: 15px 0; padding: 18px; font-size: 20px; border: none; border-radius: 15px; background-color: #ffeaa7; color: #2d3436; cursor: pointer; font-weight: bold; box-shadow: 0 5px #f1c40f; transition: transform 0.1s, box-shadow 0.1s; -webkit-tap-highlight-color: transparent; }
        .btn-opt:active:not(:disabled) { transform: translateY(4px); box-shadow: 0 1px #f1c40f; }
        .btn-opt:disabled { background-color: #dfe6e9; box-shadow: none; color: #b2bec3; }
        .nav-btn { background-color: #3498db; color: white; border: none; padding: 12px 24px; font-size: 16px; font-weight: bold; border-radius: 10px; cursor: pointer; margin: 10px 5px; box-shadow: 0 4px #2980b9; }
        .nav-btn:active { transform: translateY(2px); box-shadow: 0 2px #2980b9; }
        .form-group { text-align: left; margin-bottom: 15px; }
        .form-group label { display: block; font-weight: bold; margin-bottom: 6px; font-size: 15px; color: #2c3e50; }
        .form-group input, .form-group select { width: 100%; padding: 12px; border: 2px solid #bdc3c7; border-radius: 8px; box-sizing: border-box; font-size: 16px; }
        .form-group input:focus, .form-group select:focus { border-color: #3498db; outline: none; }
        .btn-add { background-color: #2ecc71; color: white; border: none; padding: 14px; font-size: 18px; font-weight: bold; border-radius: 8px; cursor: pointer; width: 100%; box-shadow: 0 4px #27ae60; }
        .btn-add:active { transform: translateY(2px); box-shadow: 0 2px #27ae60; }
        .q-item { background: #f8f9fa; padding: 12px; border-left: 5px solid #3498db; margin-bottom: 10px; border-radius: 0 8px 8px 0; text-align: left; font-size: 15px; position: relative; }
        .btn-delete { position: absolute; right: 10px; top: 50%; transform: translateY(-50%); background-color: #e74c3c; color: white; border: none; padding: 6px 12px; border-radius: 6px; cursor: pointer; font-weight: bold; }
    </style>
</head>
<body>

    <div class="container">
        <!-- NAVIGATION BAR -->
        <div style="margin-top: 10px;">
            <button class="nav-btn" onclick="switchPage('page-be')">🌟 Trang Cho Bé</button>
            <button class="nav-btn" style="background-color: #7f8c8d; box-shadow: 0 4px #636e72;" onclick="switchPage('page-admin')">⚙️ Quản Lý</button>
        </div>

        <!-- PAGE 1: QUIZ GAME FOR KIDS -->
        <div id="page-be" class="page active">
            <div class="card">
                <p id="question-text" style="font-size: 24px; font-weight: bold; color: #2c3e50;"></p>
                <div id="options-box"></div>
                <p id="feedback" style="font-size: 24px; font-weight: bold; height: 35px; margin-top: 20px;"></p>
            </div>
        </div>

        <!-- PAGE 2: PARENT MANAGEMENT -->
        <div id="page-admin" class="page">
            <div class="card" style="border-color: #7f8c8d;">
                <h2>➕ Tạo Câu Hỏi Mới</h2>
                <div class="form-group">
                    <label>Nội dung câu hỏi:</label>
                    <input type="text" id="add-q" placeholder="Ví dụ: Con gì thích ăn hạt dẻ?">
                </div>
                <div class="form-group">
                    <label>Đáp án A:</label>
                    <input type="text" id="add-a" placeholder="Đáp án A">
                </div>
                <div class="form-group">
                    <label>Đáp án B:</label>
                    <input type="text" id="add-b" placeholder="Đáp án B">
                </div>
                <div class="form-group">
                    <label>Đáp án C:</label>
                    <input type="text" id="add-c" placeholder="Đáp án C">
                </div>
                <div class="form-group">
                    <label>Đáp án chính xác:</label>
                    <select id="add-correct">
                        <option value="option_a">Đáp án A</option>
                        <option value="option_b">Đáp án B</option>
                        <option value="option_c">Đáp án C</option>
                    </select>
                </div>
                <button class="btn-add" onclick="addNewQuestion()">Lưu Câu Hỏi</button>
                
                <h3 style="text-align: left; margin-top: 25px; color:#2c3e50; border-bottom: 2px solid #7f8c8d; padding-bottom: 5px;">🗂️ Danh Sách Câu Hỏi Hiện Tại:</h3>
                <div id="questions-list"></div>
            </div>
        </div>
    </div>

    <script>
        let questions = [];
        let currentIdx = 0;
        let score = 0;

        const defaultQuestions = [
            { question: 'Con gì có hai tai dài và thích ăn cà rốt?', option_a: 'Con hổ', option_b: 'Con thỏ', option_c: 'Con sóc', correct_option: 'option_b' },
            { question: 'Quả dưa hấu bên trong ruột thường có màu gì?', option_a: 'Màu đỏ', option_b: 'Màu vàng', option_c: 'Màu xanh', correct_option: 'option_a' },
            { question: 'Mặt trời mọc ở hướng nào bé nhỉ?', option_a: 'Hướng Tây', option_b: 'Hướng Nam', option_c: 'Hướng Đông', correct_option: 'option_c' }
        ];

        window.onload = function() {
            let saved = localStorage.getItem('local_quiz_db');
            if (!saved) {
                questions = [...defaultQuestions];
                localStorage.setItem('local_quiz_db', JSON.stringify(questions));
            } else {
                questions = JSON.parse(saved);
            }
            initGame();
            renderAdminList();
        };

        function switchPage(pageId) {
            document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
            document.getElementById(pageId).classList.add('active');
            if(pageId === 'page-be') initGame();
        }

        function initGame() {
            questions.sort(() => Math.random() - 0.5);
            currentIdx = 0;
            score = 0;
            showQuestion();
        }

        function showQuestion() {
            const qText = document.getElementById('question-text');
            const optBox = document.getElementById('options-box');
            const feedback = document.getElementById('feedback');
            feedback.innerText = '';

            if (questions.length === 0) {
                qText.innerText = "Chưa có câu hỏi nào. Bố mẹ hãy nhấn mục Quản Lý ở trên để thêm câu hỏi nhé!";
                optBox.innerHTML = '';
                return;
            }

            if (currentIdx >= questions.length) {
                document.getElementById('page-be').innerHTML = `
                    <div class="card">
                        <h2 style="color: #2ecc71;">🎉 BÉ HOÀN THÀNH XUẤT SẮC! 🎉</h2>
                        <p style="font-size: 20px; font-weight:bold; color: #34495e;">Bé đã trả lời đúng được ${score} / ${questions.length} câu hỏi!</p>
                        <button class="btn-opt" style="background-color: #2ecc71; color: white; box-shadow: 0 5px #27ae60;" onclick="location.reload()">Chơi Lại Vòng Mới</button>
                    </div>`;
                return;
            }

            const q = questions[currentIdx];
            qText.innerText = `Câu ${currentIdx + 1}: ${q.question}`;
            optBox.innerHTML = `
                <button class="btn-opt" onclick="checkAnswer('option_a')">A. ${q.option_a}</button>
                <button class="btn-opt" onclick="checkAnswer('option_b')">B. ${q.option_b}</button>
                <button class="btn-opt" onclick="checkAnswer('option_c')">C. ${q.option_c}</button>
            `;
        }

        function checkAnswer(selected) {
            const q = questions[currentIdx];
            const feedback = document.getElementById('feedback');
            document.querySelectorAll('.btn-opt').forEach(b => b.disabled = true);

            if (selected === q.correct_option) {
                feedback.style.color = '#2ecc71'; feedback.innerText = 'Đúng rồi! Bé giỏi quá! 🎈🎉'; score++;
            } else {
                feedback.style.color = '#e74c3c'; feedback.innerText = 'Chưa chính xác, cố gắng câu sau nhé! ❤️';
            }
            setTimeout(() => { currentIdx++; showQuestion(); }, 1500);
        }

        function addNewQuestion() {
            const q = document.getElementById('add-q').value.trim();
            const a = document.getElementById('add-a').value.trim();
            const b = document.getElementById('add-b').value.trim();
            const c = document.getElementById('add-c').value.trim();
            const correct = document.getElementById('add-correct').value;

            if(!q || !a || !b || !c) return alert("Bố mẹ vui lòng điền đủ câu hỏi và 3 đáp án nhé!");

            const newQ = { question: q, option_a: a, option_b: b, option_c: c, correct_option: correct };
            
            let currentData = JSON.parse(localStorage.getItem('local_quiz_db')) || [];
            currentData.push(newQ);
            localStorage.setItem('local_quiz_db', JSON.stringify(currentData));
            
            questions = currentData;
            alert("Đã thêm câu hỏi vào bộ nhớ iPad/Điện thoại thành công!");
            
            document.getElementById('add-q').value = '';
            document.getElementById('add-a').value = '';
            document.getElementById('add-b').value = '';
            document.getElementById('add-c').value = '';
            renderAdminList();
        }

        function deleteQuestion(index) {
            if(confirm("Bố mẹ có chắc chắn muốn xóa câu hỏi này không?")) {
                let currentData = JSON.parse(localStorage.getItem('local_quiz_db')) || [];
                currentData.splice(index, 1);
                localStorage.setItem('local_quiz_db', JSON.stringify(currentData));
                questions = currentData;
                renderAdminList();
            }
        }

        function renderAdminList() {
            const listDiv = document.getElementById('questions-list');
            let currentData = JSON.parse(localStorage.getItem('local_quiz_db')) || [];
            
            if(currentData.length === 0) {
                listDiv.innerHTML = "<p style='color: #7f8c8d; text-align:center;'>Chưa có câu hỏi nào trong bộ nhớ.</p>";
                return;
            }
            
            listDiv.innerHTML = currentData.map((q, i) => `
                <div class="q-item">
                    <strong>${i+1}. ${q.question}</strong><br>
                    <span style="color:#27ae60; font-weight:bold;">Đáp án đúng: ${q.correct_option.replace('option_', '').toUpperCase()}</span>
                    <button class="btn-delete" onclick="deleteQuestion(${i})">Xóa</button>
                </div>
            `).join('');
        }
    </script>
</body>
</html>
